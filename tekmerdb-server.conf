# TekmerDB Server Configuration
# tekmerdb-server.conf — place in the root tekmerdb/ directory
# Engine reads this on startup. Changes require restart, not recompile.
# If this file is missing, engine starts with built-in defaults.

# ── Domain ────────────────────────────────────────────────────────────────────

# The EU AI Act risk category this engine instance accepts.
# Every PFO is stamped with this domain regardless of what the caller declares.
# Claims from other domains are rejected unless they score above domain_threshold.
# Valid values: Healthcare, LawEnforcement, CriticalInfrastructure, Employment,
#               Education, Migration, LegalInterpretation, Finance, General
# Impact: changing domain invalidates the existing centroid — wipe data/ and restart.
domain = "CriticalInfrastructure"

# ── Domain Enforcement ────────────────────────────────────────────────────────

# Minimum cosine similarity between a claim and the domain centroid for acceptance.
# Claims scoring below this threshold are rejected with status "rejected".
# Range: 0.0–1.0. Lower = more permissive, higher = stricter domain enforcement.
# Impact: too low accepts off-domain claims, too high rejects valid edge cases.
# Tested working range for energy domain: 0.65–0.80. Default: 0.70.
domain_threshold = 0.70

# Number of inserts before domain enforcement begins.
# During this window the engine accepts all claims to build the domain centroid.
# Impact: too low builds a weak centroid, too high delays enforcement.
# Default: 10. Do not set below 5.
cold_start_inserts = 10

# ── Sweep ─────────────────────────────────────────────────────────────────────

# Number of HNSW candidates evaluated per sweep after each insert.
# Higher = more thorough conflict/corroboration detection, slower inserts.
# Lower = faster inserts, may miss conflicts between semantically distant claims.
# Impact: at 100k+ PFOs, values above 50 will noticeably slow insert throughput.
# Default: 20.
hnsw_top_k = 20

# Minimum cosine similarity between two PFOs before NLI is invoked.
# Claims below this threshold are skipped — treated as unrelated topics.
# This is the primary gate preventing false conflicts between different topics.
# Impact: too low causes false NLI conflicts between unrelated energy claims.
#         too high misses real conflicts between closely worded contradictions.
# Tested safe floor for energy domain: 0.90. Do not lower below 0.85.
similarity_floor = 0.90

# ── Storage ───────────────────────────────────────────────────────────────────

# Seconds between Parquet flush cycles for both PFOs and sources.
# Lower = more frequent disk writes, higher durability guarantee, more I/O.
# Higher = less I/O, larger potential data loss window on crash (mitigated by CRB).
# Impact: the CRB (fsync on every write) protects against crash regardless.
#         this controls how stale the Parquet checkpoint can get.
# Default: 10. Minimum recommended: 5.
flush_interval_secs = 10

# ── Network ───────────────────────────────────────────────────────────────────

# Network interface the HTTP engine binds to.
# "127.0.0.1" — localhost only, not reachable from outside the machine (safe default)
# "0.0.0.0"   — all interfaces, reachable from the network (required for Docker/remote)
# Impact: exposing to 0.0.0.0 with no authentication on PATCH endpoint is a security risk.
#         Only use 0.0.0.0 behind a firewall or when RBAC is implemented.
# Default: 127.0.0.1
engine_host = "127.0.0.1"

# Port the HTTP engine listens on.
# Impact: MCP server connects to localhost:{engine_port} — must match.
# Default: 3000.
engine_port = 3000

# ── MCP Server (SSE mode) ─────────────────────────────────────────────────────

# Network interface the MCP SSE server binds to when started with --sse flag.
# "0.0.0.0"   — all interfaces, reachable from remote agents (default for SSE)
# "127.0.0.1" — localhost only
# Impact: SSE mode has no authentication — only expose on trusted networks.
# Default: 0.0.0.0
mcp_host = "0.0.0.0"

# Port the MCP SSE server listens on.
# Must be different from engine_port.
# Remote agents connect to: http://{server_ip}:{mcp_port}/sse
# Default: 3001.
mcp_port = 3001